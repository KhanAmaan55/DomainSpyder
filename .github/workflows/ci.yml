name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENCE", ".gitignore"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENCE", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check --output-format=github domainspyder/

      - name: Check formatting with Black
        run: black --check --diff domainspyder/

      - name: Type check with mypy
        continue-on-error: true
        run: mypy domainspyder/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=domainspyder \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  package:
    name: Build & smoke-test package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Check wheel contents
        shell: python
        run: |
          import glob
          import zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "domainspyder/wordlists/default.txt" in names, "wordlist missing from wheel"
          assert "domainspyder/assets/img/logo.png" in names, "report logo missing from wheel"
          stray = [n for n in names if not n.startswith("domainspyder")]
          assert not stray, f"unexpected top-level files in wheel: {stray}"

      - name: Install wheel and smoke-test outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/domainspyder --version
          smoke/bin/python -m domainspyder --help > /dev/null
          smoke/bin/python -c "import os; from domainspyder.config import DEFAULT_WORDLIST as w; assert os.path.isfile(w), w"
          status=0
          smoke/bin/domainspyder dns "not a domain" || status=$?
          test "$status" -eq 2
