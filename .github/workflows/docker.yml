name: Docker

# Pushes to main, and pull requests that touch the image, build and smoke-test
# it without publishing. Push events deliberately have no paths filter, so a
# release tag can never be skipped by one. Pushing a v* tag (the same tag that
# publishes to PyPI) builds for amd64 and arm64 and pushes the same image to
# Docker Hub and GitHub Container Registry (ghcr.io) as :X.Y.Z, :X.Y, :X and
# :latest. Docker Hub needs the DOCKERHUB_USERNAME repository variable and the
# DOCKERHUB_TOKEN secret (a Docker Hub access token with Read & Write scope).
# GHCR uses the workflow's GITHUB_TOKEN; after the first push, make the package
# public in its GitHub package settings.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "domainspyder/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: docker.io/khanamaan/domainspyder

jobs:
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image for the runner's platform
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: domainspyder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --rm domainspyder:ci --version
          docker run --rm domainspyder:ci --help > /dev/null
          docker run --rm --entrypoint python domainspyder:ci -c \
            "import os; from domainspyder.config import DEFAULT_WORDLIST as w; assert os.path.isfile(w), w"
          status=0
          docker run --rm domainspyder:ci dns "not a domain" || status=$?
          test "$status" -eq 2

  publish:
    name: Publish to Docker Hub & GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/khanamaan/domainspyder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same guard as the PyPI release: the tag must match the package version.
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          import re

          source = open("domainspyder/_version.py").read()
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          tag = os.environ["TAG"]
          assert tag == f"v{version}", f"tag {tag} does not match package version {version}"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<repo>, derived from the repository so it follows a
      # rename or transfer. GHCR rejects uppercase, so lowercase it.
      - name: Set GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # latest is added automatically for the highest semver tag.

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
