[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domainspyder"
dynamic = ["version"]
description = "Domain Intelligence Framework: subdomains, DNS, ports, tech detection and WHOIS from one CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
authors = [{ name = "Amaan Khan" }]
requires-python = ">=3.9"
keywords = [
    "recon",
    "osint",
    "subdomain-enumeration",
    "dns",
    "whois",
    "port-scanner",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "requests>=2.28",
    "httpx>=0.24",
    "dnspython>=2.3",
    "rich>=13.0",
    "python-whois>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "responses>=0.23",
    # Pinned: these gate CI, and a minor bump can widen
    # the default rule set or change the formatting style.
    "ruff>=0.16,<0.17",
    "black>=25.11,<26.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/KhanAmaan55/DomainSpyder"
Source = "https://github.com/KhanAmaan55/DomainSpyder"
Issues = "https://github.com/KhanAmaan55/DomainSpyder/issues"

[project.scripts]
domainspyder = "domainspyder.cli:main"

[tool.setuptools.dynamic]
version = { attr = "domainspyder._version.__version__" }

[tool.setuptools.packages.find]
include = ["domainspyder*"]

[tool.setuptools.package-data]
domainspyder = ["assets/img/*.png", "wordlists/*.txt"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly so a new Ruff release cannot widen the rule set under CI.
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific
    "FURB",   # refurb
    "PLW",    # Pylint warnings
]
ignore = [
    "E501",   # line length is Black's job
]

[tool.ruff.lint.isort]
known-first-party = ["domainspyder"]
